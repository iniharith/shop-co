<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kampungcetak Admin</title>
  <style>
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      /* Add some simple animation */
      animation: fadeIn 1s ease-in-out;
    }
    img {
      max-width: 60%;
      max-height: 60%;
      object-fit: contain;
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <img src="icon.png" alt="Kampungcetak Logo">
</body>
</html>
